name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to populate (recovery only)
        required: false
        type: string
      release_version:
        description: SemVer matching the recovery tag
        required: false
        type: string

permissions: {}

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created || steps.recovery.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name || steps.recovery.outputs.tag_name }}
      version: ${{ steps.release.outputs.version || steps.recovery.outputs.version }}
    steps:
      - id: release
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - id: recovery
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ -z "$RELEASE_VERSION" ]]; then
            echo "release_version is required when release_tag is set" >&2
            exit 1
          fi
          printf 'release_created=true\ntag_name=%s\nversion=%s\n' \
            "$RELEASE_TAG" "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: loonghao/vx@38bf06c866036084c42660680824abe2eeb8090f # v0.9.27
        with:
          tools: "rust@1.89.0 just@1.58.0"
          setup: "true"
          cache: "true"
          cache-key-prefix: vx-tools-${{ matrix.target }}
      - name: Build and package
        shell: pwsh
        run: vx just package "${{ matrix.target }}" "${{ needs.release-please.outputs.version }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [release-please, build]
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Write checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem -LiteralPath dist -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          Set-Content -LiteralPath dist/SHA256SUMS -Value $lines
      - uses: loonghao/vx@38bf06c866036084c42660680824abe2eeb8090f # v0.9.27
        with:
          tools: "gh"
          cache: "true"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          vx gh release upload "${{ needs.release-please.outputs.tag-name }}" dist/* --clobber
          --repo "${{ github.repository }}"
