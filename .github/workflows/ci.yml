name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: loonghao/vx@3e8c6dbe0cb83a45893f7987d5e2ecfd0ae2d75f # v0.9.28
        with:
          tools: "rust@1.89.0 just@1.58.0"
          setup: "true"
          cache: "true"
      - name: Verify
        run: vx just ci
